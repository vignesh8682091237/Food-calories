<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client History Overview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f4f4f9;
      font-family: Arial, sans-serif;
    }
    .container {
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">Client History Overview</h2>
    {% if users_history %}
      <table class="table table-bordered table-striped">
        <thead class="table-light">
          <tr>
            <th>S.No</th>
            <th>Username</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>
          {% for username, records in users_history %}
          <tr>
            <td>{{ loop.index }}</td>
            <td>{{ username }}</td>
            <td>
              <a href="{{ url_for('client_view_history_user', username=username) }}" class="btn btn-primary btn-sm">View History</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-center">No history records found.</p>
    {% endif %}
    <div class="text-center mt-3">
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
