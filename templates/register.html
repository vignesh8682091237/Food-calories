<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register Page</title>
    <style>
        body {
            background: linear-gradient(to bottom, #ffefba, #ffffff); /* Background color same as login page */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1{
            color: darkblue;
            text-align: center;
        }
        h2 {
            color: red;
            text-align: center;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        label {
            color: green;
            font-size: 12px;
            display: block;
            margin-top: 10px;
        }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 7px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: none;
            border-radius: 4px;
            background-color: #6a0dad;
            color: white;
            font-size: 14px;
        }
        input::placeholder {
            color: #dddddd;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background-color: green;
        }
        p {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
        }
        a {
            color: green;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>AI BASED FOOD CALORIES ESTIMATION USING IMAGE PROCES</h1>
    <h2>Register Page</h2>
    <form method="POST" action="/register">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" required>
        
        <label for="height">Height (cm):</label>
        <input type="number" id="height" name="height" placeholder="Enter your height" required>
        
        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" name="weight" placeholder="Enter your weight" required>
        
        <label for="mobile_no">Mobile Number:</label>
        <input type="text" id="mobile_no" name="mobile_no" placeholder="Enter your mobile number" required pattern="^[0-9]{10}$">
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        
        <label for="password">Password:</label>  
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
        
        <button type="submit">Register</button>
        <p>Already have an account? <a href="/login">Login here</a></p>
    </form>
</body>
</html>
