<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client View - All Users</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f4f4f9;
      font-family: Arial, sans-serif;
    }
    .container {
      margin-top: 50px;
    }
    table {
      margin: 0 auto;
      max-width: 800px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">All User Details</h2>
    {% if users %}
      <table class="table table-bordered table-striped">
        <thead class="table-light">
          <tr>
            <th>User ID</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
            <tr>
              <td>{{ user.id }}</td>
              <td>{{ user.email }}</td>
              <td>
                <!-- Form to remove the user -->
                <form method="POST" action="{{ url_for('remove_user', user_id=user.id) }}" onsubmit="return confirm('Are you sure you want to remove this user?');">
                  <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-center">No user details found.</p>
    {% endif %}
    <div class="text-center mt-3">
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
