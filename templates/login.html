<!DOCTYPE html>
<html lang="en">
<head>
    <title> Food Estimation and Calories Using AI Based</title>
    <style>
        body {
            background: linear-gradient(to bottom, #ffefba, #ffffff);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1{
            color: darkblue;
            text-align: center;
        }
        h2 {
            color: red;
            text-align: center;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        label {
            color: green;
            font-size: 12px;
            display: block;
            margin-top: 10px;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: none;
            border-radius: 4px;
            background-color: #eb4ce3;
            color: white;
            font-size: 14px;
        }
        input[type="email"]::placeholder, input[type="password"]::placeholder {
            color: #fdf5f5;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background-color: green;
        }
        p {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            color: rgb(45, 119, 216);
        }
        a {
            color: rgb(103, 192, 20);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>AI BASED FOOD CALORIES ESTIMATION USING IMAGE PROCESSING</h1><BR> </BR><h1>WELCOME</h1>
    <h2>Login</h2>
    <form method="POST" action="/login">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6">
        
        <button type="submit">Login</button>
        <p><a href="/forgot-password">Forgot Password?</a></p>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
        <p>Don't have an account? <a href="/register">Register here</a></p>
    </form>
</body>
</html>
